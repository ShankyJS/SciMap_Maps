name: Publish or roll back website dataset

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Published release folder name from Slack or the daily run log
        type: string
        required: true
      pointer:
        description: Pointer to select (latest-validated cannot move backwards)
        type: choice
        default: website-release
        options:
          - website-release
          - latest-validated
      approved_by:
        description: Name of the actual approver (required for website-release)
        type: string
      reason:
        description: Reason for this selection (required for website-release)
        type: string
      dry_run:
        description: Show the current and proposed selection without writing to R2
        type: boolean
        default: true
      legacy_run_id:
        description: GitHub run ID fallback for releases without a durable receipt
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: termination-release-publication
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: scimap-candidates
    steps:
      - uses: actions/checkout@v4
        with:
          path: analysis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clvcooke/scimap
          ref: ca167515757a295df811d8a9df7a40b80a3c1f37
          path: website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and select the published release
        working-directory: analysis
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          POINTER: ${{ inputs.pointer }}
          APPROVED_BY: ${{ inputs.approved_by }}
          REASON: ${{ inputs.reason }}
          DRY_RUN: ${{ inputs.dry_run }}
          LEGACY_RUN_ID: ${{ inputs.legacy_run_id }}
          GH_TOKEN: ${{ github.token }}
          SCIMAP_ALERT_WEBHOOK_URL: ${{ secrets.SCIMAP_ALERT_WEBHOOK_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://17067e7373bbfee2043fe5186d66aeb9.r2.cloudflarestorage.com
        run: |
          flags=()
          if [ "$DRY_RUN" = 'false' ]; then flags+=(--apply); fi
          python scripts/select_published_termination_release.py \
            --scimap ../website --output "$RUNNER_TEMP/termination-selection" \
            --release-id="$RELEASE_ID" --pointer="$POINTER" \
            --approved-by="$APPROVED_BY" --reason="$REASON" \
            --legacy-run-id="$LEGACY_RUN_ID" "${flags[@]}"
      - name: Retain selection audit record, including unconfirmed writes
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: termination-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/termination-selection/selection-record.json
          if-no-files-found: ignore
