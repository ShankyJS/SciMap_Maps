name: Daily termination candidate

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'ISO cutoff (blank = current UTC date)'
        type: string
      publish:
        description: 'Publish candidate and advance latest-validated (never website selection)'
        type: boolean
        default: false
      historical:
        description: 'Historical replay: never advance latest-validated'
        type: boolean
        default: false
  schedule:
    # Proposed UTC time; job stays off until the team enables SCIMAP_DAILY_ENABLED.
    - cron: '15 13 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: termination-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || vars.SCIMAP_DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require operations acceptance before a hosted run
        env:
          READY: ${{ vars.SCIMAP_RUNTIME_READY }}
        run: |
          test "$READY" = true || { echo 'Set SCIMAP_RUNTIME_READY=true after the team accepts GitHub-hosted daily runs.'; exit 1; }
  candidate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: scimap-candidates
    env:
      R_LIBS_USER: ${{ github.workspace }}/analysis/R-library
    steps:
      - uses: actions/checkout@v4
        with:
          path: analysis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clvcooke/scimap
          # Reviewed AWS CLI publisher on https://github.com/clvcooke/scimap/pull/49.
          # Newest passing head that contains that publisher (scripts unchanged since c118efe).
          ref: ca167515757a295df811d8a9df7a40b80a3c1f37
          path: website
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements-daily.txt
      - name: Install pinned Python packages
        run: python -m pip install -r analysis/requirements-daily.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/analysis/R-library
          key: r-libs-4.6.1-${{ hashFiles('analysis/r-version.txt', 'analysis/r-packages.lock.csv') }}
      - name: Install locked R packages
        working-directory: analysis
        run: Rscript scripts/install_locked_r_packages.R r-packages.lock.csv
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.daily-tools
          key: daily-tools-tippecanoe-2.79.0-rclone-1.75.1-aws-2.40.0
      - name: Install pinned Tippecanoe, AWS CLI, and rclone
        run: bash analysis/scripts/install_daily_toolchain.sh "${{ github.workspace }}/.daily-tools"
      - name: Put pinned tools on PATH
        run: echo "${{ github.workspace }}/.daily-tools/bin" >> "$GITHUB_PATH"
      - name: Check pinned runtime
        working-directory: analysis
        env:
          AWS_PAGER: ''
          AWS_CLI_AUTO_PROMPT: 'off'
        run: |
          python3 --version
          Rscript scripts/check_r_environment.R r-version.txt r-packages.lock.csv
          tippecanoe --version 2>&1 | grep -Fx 'tippecanoe v2.79.0'
          # Publisher shells out to AWS CLI v2 with these flags. Reject an older CLI before any upload.
          aws --version 2>&1 | grep -Eq '^aws-cli/2\.'
          aws s3api put-object help | grep -q -- '--if-none-match'
          aws s3api list-objects-v2 help | grep -q -- '--no-paginate'
          # select_termination_release.py at this pin still calls rclone for pointer reads and writes.
          rclone version | head -n 1 | grep -Fx 'rclone v1.75.1'
          python3 -c 'import sys, pandas, geopandas; assert sys.version_info[:2] == (3, 12); assert pandas.__version__ == "2.2.3"; assert geopandas.__version__ == "1.1.0"'
      - name: Fetch approved commuter inputs
        id: inputs
        working-directory: analysis
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://17067e7373bbfee2043fe5186d66aeb9.r2.cloudflarestorage.com
          SCIMAP_PRIVATE_BUCKET: scimap-private-inputs
          SCIMAP_PRIVATE_KEY: inputs/county_commute_NIH.csv
          INPUT_DIR: ${{ runner.temp }}/daily-inputs
          INPUT_ERROR: ${{ runner.temp }}/input-fetch-error.txt
        run: |
          set -euo pipefail
          python3 scripts/fetch_daily_inputs.py --output "$INPUT_DIR" --error-log "$INPUT_ERROR"
      - name: Run daily candidate pipeline
        id: daily
        working-directory: analysis
        env:
          INPUT_DIR: ${{ runner.temp }}/daily-inputs
          AS_OF: ${{ inputs.as_of }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          HISTORICAL: ${{ inputs.historical }}
          SCIMAP_ALERT_WEBHOOK_URL: ${{ secrets.SCIMAP_ALERT_WEBHOOK_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://17067e7373bbfee2043fe5186d66aeb9.r2.cloudflarestorage.com
        shell: bash
        run: |
          set -euo pipefail
          cutoff="${AS_OF:-$(date -u +%F)}"
          flags=()
          if [ "$PUBLISH" = true ]; then flags+=(--publish); fi
          if [ "$HISTORICAL" = true ]; then flags+=(--historical); fi
          python3 scripts/run_daily_terminations.py \
            --scimap ../website --as-of "$cutoff" \
            --county-commute "$INPUT_DIR/county_commute_NIH.csv" \
            --district-commute "$INPUT_DIR/home_119_workTR.csv" \
            --source-baseline data --reference-output output \
            --output "$RUNNER_TEMP/termination-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --notify "${flags[@]}"
      - name: Alert for setup or input failures before the orchestrator starts
        if: failure() && steps.daily.outcome != 'failure'
        working-directory: analysis
        env:
          SCIMAP_ALERT_WEBHOOK_URL: ${{ secrets.SCIMAP_ALERT_WEBHOOK_URL }}
          INPUT_ERROR: ${{ runner.temp }}/input-fetch-error.txt
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import alerts
          detail = 'See the failed setup step'
          title = 'Daily runtime setup'
          error_path = Path(os.environ.get('INPUT_ERROR', ''))
          if error_path.is_file():
              detail = error_path.read_text()[:1500]
              title = 'Daily input fetch'
          alerts.send(alerts.webhook_from_env(), alerts.run_failed(title, RuntimeError(detail), {}))
          PY
      - name: Retain logs, manifests, upload/selection evidence and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termination-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/termination-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/termination-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/termination-${{ github.run_id }}-${{ github.run_attempt }}/analysis/run-report.json
            ${{ runner.temp }}/termination-${{ github.run_id }}-${{ github.run_attempt }}/release/manifest.json
          if-no-files-found: warn
