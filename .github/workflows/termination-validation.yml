name: Termination validation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Scientific tooling (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run scientific validation and alert regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          python -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee test-results/scientific-tooling.log
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-tooling-python-${{ matrix.python }}
          path: test-results/scientific-tooling.log
